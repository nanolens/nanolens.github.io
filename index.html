<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nanolens — high-throughput real-time metrics</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2a;
    --accent: #7c5cff;
    --accent2: #00d4aa;
    --text: #e8e8f0;
    --muted: #6b6b7d;
    --mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;
    --sans: -apple-system, "Inter", "Segoe UI", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(124, 92, 255, 0.08), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(0, 212, 170, 0.04), transparent 50%),
      var(--bg);
  }
  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2.5rem;
    border-bottom: 1px solid var(--border);
    background: rgba(10, 10, 15, 0.8);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
  }
  .logo {
    font-family: var(--mono);
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--text);
  }
  .logo .dot { color: var(--accent); }
  .nav { display: flex; gap: 2rem; align-items: center; }
  .nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.2s;
  }
  .nav a:hover { color: var(--text); }
  .badge-dev {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent2);
    border: 1px solid rgba(0, 212, 170, 0.3);
    background: rgba(0, 212, 170, 0.06);
    padding: 0.3rem 0.65rem;
    border-radius: 4px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  /* Main */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 2.5rem;
    gap: 1.8rem;
  }
  .hero {
    text-align: center;
    max-width: 680px;
  }
  .hero h1 {
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1.12;
    margin-bottom: 0.85rem;
  }
  .hero h1 .grad {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
    max-width: 520px;
    margin: 0 auto;
  }
  /* Metrics */
  .metrics {
    display: flex;
    gap: 3rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .metric { text-align: center; min-width: 160px; }
  .metric .value {
    font-family: var(--mono);
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 0.4rem;
  }
  .metric:nth-child(1) .value { color: var(--accent); }
  .metric:nth-child(2) .value { color: var(--accent2); }
  .metric:nth-child(3) .value { color: #ff6b9d; }
  .metric .label {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  /* Footer */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2.5rem;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .footer-links { display: flex; gap: 1.5rem; align-items: center; }
  .footer-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.82rem;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--text); }
  .copyright {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
  }
  /* Responsive */
  @media (max-height: 720px) {
    .hero h1 { font-size: 2.1rem; }
    .metric .value { font-size: 1.8rem; }
    main { gap: 1.3rem; }
  }
  @media (max-width: 700px) {
    .hero h1 { font-size: 1.9rem; }
    .metrics { gap: 1.8rem; }
    .metric .value { font-size: 1.6rem; }
    html, body { overflow-y: auto; }
    main { padding: 1.5rem 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">nanolens<span class="dot">.</span>io</div>
  <nav class="nav">
    <span class="badge-dev">in development</span>
  </nav>
</header>

<main>
  <div class="hero">
    <h1>High-throughput<br><span class="grad">real-time metrics</span></h1>
    <p>Ingest, analyze and visualize massive metric streams with lossless HDR histogram precision.</p>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="value">100M</div>
      <div class="label">EVENTS PER SECOND</div>
    </div>
    <div class="metric">
      <div class="value">Real-time</div>
      <div class="label">STREAM ANALYSIS</div>
    </div>
    <div class="metric">
      <div class="value">Lossless</div>
      <div class="label">HDR HISTOGRAMS</div>
    </div>
  </div>
</main>

<footer>
  <div class="footer-links">
    <a href="mailto:hello@nanolens.io">Contact</a>
  </div>
  <div class="copyright">&copy; 2026 nanolens</div>
</footer>

</body>
</html>
